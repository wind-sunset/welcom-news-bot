name: 웰컴저축은행 뉴스 자동 검색

on:
  schedule:
    # 30분 간격, KST 06:00~20:00 (UTC 21:00~11:00)
    # KST 06:00~08:30 = UTC 21:00~23:30 (전날)
    - cron: '0,30 21-23 * * *'
    # KST 09:00~19:30 = UTC 00:00~10:30
    - cron: '0,30 0-10 * * *'
    # KST 20:00 = UTC 11:00
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  search-news:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v6.0.2

      - name: Python 설정
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 패키지 설치
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 뉴스 검색 및 이메일 전송
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FILTER_HOURS: '1'
        run: |
          python news_bot.py

      - name: 실행 결과 요약
        if: always()
        run: |
          echo "🤖 뉴스 검색 봇 실행 완료"
          echo "📅 실행 시간: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')"
